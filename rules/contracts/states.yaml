version: 3
work_state:
  PROGRESS:
    label: "진행"
    meaning: "현재 내부 Agent가 수행할 수 있는 설계·구현·응답·수정 작업이 하나 이상 존재하는 상태."
  WAITING:
    label: "대기"
    meaning: "내부 Agent가 더 진행할 수 있는 작업이 없고 사용자 또는 외부 입력이 들어와야만 진행할 수 있는 상태."
  REVIEW:
    label: "리뷰"
    meaning: "현재 Work의 다음 핵심 행동이 Review 또는 Final Checklist인 상태."
  CLOSED:
    label: "종료"
    meaning: "사용자가 현재 Work Cycle을 종료한다고 명시적으로 승인한 상태."
closure_result:
  COMPLETE:
    label: "완성"
    meaning: "사용자가 현재 목적을 충족한 결과로 승인한 종료 결과."
  INCOMPLETE:
    label: "미완성"
    meaning: "남은 미완료 사항을 인지한 상태에서 사용자가 현재 Cycle을 종료하기로 승인한 결과."
work_mapping_order:
  - "사용자 승인으로 CLOSED가 확정되었으면 다른 내부 조건보다 CLOSED를 우선한다."
  - "종료되지 않았고 Work 전체 Review 또는 Final Checklist가 다음 핵심 행동이면 REVIEW로 매핑한다."
  - "내부 Actor가 수행할 수 있는 행동이 하나라도 있으면 PROGRESS로 매핑한다."
  - "내부 행동이 없고 사용자 또는 외부 입력만 필요하면 WAITING으로 매핑한다."
simplification_rule: "Task와 Issue의 세부 진행은 별도 상태 열거형으로 만들지 않고 Task/Thread 기록, Review 결과, next_actor, condition으로 설명한다. 새로운 세부 상태 코드는 실제 라우팅에 반드시 필요하다는 근거와 사용자 승인 없이 추가하지 않는다."
