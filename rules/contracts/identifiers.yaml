version: 2
canonical: true
work_root:
  format: "YYMMDD-<topic>-<uuid>"
  example: "261010-agent-workflow-a12f7c"
  rule: "Work Root ID는 최초 아이디어의 설계·구현·검증 전체 계보를 식별하며 생성 이후 재개·설계수정·Task추가로 변경하지 않는다."
uuid:
  rule: "UUID의 실제 생성 방식과 길이는 이 파일에서만 변경하며 이미 발급된 UUID는 재생성하지 않는다."
  recommended_length: 6
design_item:
  format: "<uuid>-<4digit>"
  example: "a12f7c-0001"
task:
  format: "<uuid>-T<4digit>"
  example: "a12f7c-T0001"
issue:
  format: "<task-id>-I<3digit>"
  example: "a12f7c-T0001-I001"
event:
  format: "<4digit>-<message-type>.md"
  example: "0004-QUESTION.md"
immutability:
  - "발급된 Work Root ID, Task ID, Issue ID는 의미가 변경되더라도 재사용하거나 다른 대상에 재할당하지 않는다."
