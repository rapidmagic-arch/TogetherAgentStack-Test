version: 7
stages:
  - id: REPOSITORY_ENTRY
    entry: "Agent가 저장소 작업을 시작한다."
    must: "Branch, Head, Core, 필요한 Contract, Manual Index를 읽고 현재 Work 존재 여부와 자신의 작업면을 확인한다."
    exit: "Work 실행면이면 WORK_DISCOVERY로, integrate/<WORK-ID>이면 INTEGRATION으로, 특정 Work와 무관한 Maintenance Branch이면 rule-maintenance 절차로 이동하며, 작업이 없으면 사용자에게 다음 작업을 요청한다."
  - id: WORK_DISCOVERY
    entry: "Work가 존재하거나 새 Work 생성이 필요하다."
    must: "STATUS, TASK-INDEX, next_actor, open_issue, 현재 Task의 마지막 기록과 Review 대기 여부를 확인하여 지금 실제로 필요한 행동 종류를 식별한다."
    exit: "새 설계·구현·수정 실행이면 EXECUTION으로, 열린 Issue에 대한 Actor 판단이면 ISSUE_HANDOFF로, Result가 Review 대기이면 TASK_REVIEW로, HUMAN 전용 판단이 필요하면 HUMAN_DECISION으로, 필수 Task가 더 없어 종료 후보이면 FINAL_REVIEW로 이동한다."
  - id: EXECUTION
    entry: "현재 Actor가 Task를 수행할 권한과 입력을 가진다."
    must: "필요한 Design·이전 Summary만 읽고 역할 범위 안에서 작업하며 의미 있는 결과를 기록한다."
    exit: "같은 Task 작업을 계속하면 EXECUTION에 머물고, 다른 Actor 판단이 필요하면 ISSUE_HANDOFF로, 결과가 Review 가능하면 TASK_REVIEW로, HUMAN 전용 판단이 필요하면 HUMAN_DECISION으로 이동한다."
  - id: ISSUE_HANDOFF
    entry: "현재 Actor만으로 확정할 수 없는 구체 문제가 Task 진행을 막는다."
    must: "Issue Thread에 문제·시도·필요 판단·영향·Commit을 기록하고 next_actor를 갱신하여 Push한다."
    exit: "Decision이 실제 반영·검증·확인되어 Issue가 닫힌 뒤 추가 실행이 필요하면 EXECUTION으로, 결과가 Review 가능하면 TASK_REVIEW로, HUMAN 전용 판단이 남으면 HUMAN_DECISION으로 이동한다."
  - id: TASK_REVIEW
    entry: "Task 결과가 Condition과 Verification 근거를 갖추어 Review 가능하다."
    must: "Reviewer가 review-results.yaml의 결과 중 하나를 정확한 Review 범위와 근거에 연결하여 판정한다."
    exit: "PASS이면 Task 완료 시점과 Summary를 기록하고 PRIORITY_REFRESH로 이동하며, REWORK이면 EXECUTION으로, DESIGN_ISSUE이면 ISSUE_HANDOFF로, USER_DECISION_REQUIRED이면 HUMAN_DECISION으로 이동한다."
  - id: PRIORITY_REFRESH
    entry: "의미 있는 Task 작업 또는 Review가 끝났다."
    must: "남은 미완료 Task의 현재 우선순위를 다시 확인하고 명확하면 TASK-INDEX를 최신화한다."
    exit: "다음 Task가 선택되면 EXECUTION으로, 필수 Task가 더 없으면 FINAL_REVIEW로, 순서에 따라 사용자 결과가 달라져 Agent가 정할 수 없으면 HUMAN_DECISION으로 이동한다."
  - id: FINAL_REVIEW
    entry: "현재 목적에 필요한 필수 Task가 더 이상 없다고 판단한다."
    must: "Final Checklist를 수행하고 열린 Issue·Design 반영·전체 검증·미완료 항목을 확인한다."
    exit: "계속 진행 또는 종료 결과를 사용자가 판단할 수 있는 보고를 준비하고 HUMAN_DECISION으로 이동한다."
  - id: HUMAN_DECISION
    entry: "Task Review·Issue·Priority·Final Review 등에서 목적·권한·범위·사용자 결과처럼 HUMAN만 확정할 수 있는 판단이 필요하거나, 사용자가 현재 Cycle을 즉시 종료하겠다고 명시한다."
    must: "HUMAN 응답이 아직 필요한 경우 판단 질문, 선택지, 각 선택의 영향, 판단 적용 대상과 응답 후 재개 Stage를 Work에 기록하고 next_actor=HUMAN으로 표시하며 내부에서 별도로 수행할 행동이 없으면 WAITING으로 매핑한다. 사용자가 이미 충분히 명확한 결정을 제공한 경우에는 그 결정을 Work에 기록하고 next_actor를 다시 HUMAN으로 설정하지 않은 채 해당 재개 Stage 또는 INTEGRATION으로 즉시 이동한다."
    exit: "HUMAN 답변은 Work에 기록된 재개 지점에 따라 WORK_DISCOVERY, EXECUTION, ISSUE_HANDOFF, TASK_REVIEW, PRIORITY_REFRESH, FINAL_REVIEW 중 하나로 이동하며, CLOSED/COMPLETE 또는 CLOSED/INCOMPLETE를 승인한 경우에는 INTEGRATION으로 이동한다."
  - id: INTEGRATION
    entry: "HUMAN이 Work를 CLOSED로 승인하고 closure_result를 COMPLETE 또는 INCOMPLETE로 확정했다."
    must: "Integration Manual에 따라 최신 main에서 integrate/<WORK-ID>를 만들고 승인된 최종 산출물만 선별한 Final Integration PR을 준비하며 Merge 직전에 CLOSED·closure_result·source Commit을 다시 검증한다."
    exit: "Final Integration PR이 main에 반영되고 main Commit과 PR 참조가 Closure History에 기록되면 완료되며, Work가 Reopen되거나 source 결과가 변경된 정합성 위반을 발견하면 기존 Integration을 중단하고 REOPEN으로 이동한다."
  - id: REOPEN
    entry: "종료 후 실제 사용에서 문제 또는 추가 작업 필요가 발견되거나 CLOSED 상태에서 source 결과 변경처럼 새 Cycle이 필요한 사실이 확인된다."
    must: "기존 Work ID와 과거 종료 기록을 보존하고 재개 이유·시점·새 Task 또는 재검토 대상을 추가한다."
    exit: "실제 다음 행동이 새 Task 탐색이면 WORK_DISCOVERY로, 실행이면 EXECUTION으로, 특정 Task 결과 재검토이면 TASK_REVIEW로, Work 전체 재검토이면 FINAL_REVIEW로 이동하고 Work State는 실제 조건에 따라 PROGRESS 또는 REVIEW로 매핑한다."
rule: "Lifecycle Stage는 Work State와 다른 개념이며 Task/Issue에 세부 상태 코드를 추가하지 않고 현재 행동의 진입 조건·완료 조건·다음 단계를 연결하는 Guide이다. Maintenance 절차는 특정 Work Lifecycle 바깥의 Repository 관리 절차이며 Work 결과를 다루기 시작하면 해당 Work Lifecycle로 전환한다."
